# Kitty Tab Bar Replica with Visible Slanted Dividers
format = """
[](#000000)\
[ $custom ](bg:#000000 fg:#FFB7C5 bold)\
[](fg:#000000 bg:#000000)\
$directory\
[](fg:#000000 bg:#000000)\
$git_branch\
$git_status\
[](fg:#000000)\
$character\
"""

[custom.arch_logo]
command = "echo 󰣇"
when = "true"
style = "bg:#000000 fg:#FFB7C5"
format = "[$output]($style)"

[directory]
style = "bg:#000000 fg:#FFB7C5"
format = "[ $path ]($style)"

[git_branch]
symbol = ""
style = "bg:#000000 fg:#FFB7C5"
format = "[ $symbol $branch ]($style)"

[character]
success_symbol = "[ ➜ ](#00FFFF)"
error_symbol = "[ ➜ ](bold red)"

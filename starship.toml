# Kitty Tab Bar Replica with Visible Slanted Dividers
format = """
[](#1A1A1A)\
[ $custom ](bg:#1A1A1A fg:#FFB7C5 bold)\
[](fg:#1A1A1A bg:#1A1A1A)\
$directory\
[](fg:#1A1A1A bg:#1A1A1A)\
$git_branch\
$git_status\
[](fg:#1A1A1A)\
$character\
"""

[custom.arch_logo]
command = "echo 󰣇"
when = "true"
style = "bg:#1A1A1A fg:#FFB7C5"
format = "[$output]($style)"

[directory]
style = "bg:#1A1A1A fg:#FFB7C5"
format = "[ $path ]($style)"

[git_branch]
symbol = ""
style = "bg:#1A1A1A fg:#FFB7C5"
format = "[ $symbol $branch ]($style)"

[character]
success_symbol = "[ ➜ ](#00FFFF)"
error_symbol = "[ ➜ ](bold red)"
